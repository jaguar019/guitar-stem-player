name: Native Metronome Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android_native_metronome/**'
      - '.github/workflows/metronome-android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify native offline project
        run: |
          test -f android_native_metronome/app/src/main/res/raw/drum.wav
          test -f android_native_metronome/app/src/main/res/raw/drum_accent.wav
          test -f android_native_metronome/app/src/main/res/raw/tick.wav
          test -f android_native_metronome/app/src/main/res/raw/tick_accent.wav
          for number in 1 2 3 4; do
            test -f "android_native_metronome/app/src/main/res/raw/voice_${number}.wav"
          done
          ! grep -R -E 'uses-permission.*INTERNET|TextToSpeech|jnius|kivy|python3' android_native_metronome

      - name: Build native APK
        working-directory: android_native_metronome
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK contents
        run: |
          APK=android_native_metronome/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'res/raw/drum.wav'
          unzip -l "$APK" | grep -q 'res/raw/tick.wav'
          unzip -l "$APK" | grep -q 'res/raw/voice_4.wav'
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanyouMetronome-Native-Android
          path: android_native_metronome/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Install and operate in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            APK=android_native_metronome/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.quanyou.metronome/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml window.xml
            grep -q 'text="全有节拍器"' window.xml
            grep -q 'text="鼓声"' window.xml
            grep -q 'text="人声"' window.xml
            grep -q 'text="基础打点"' window.xml
            adb shell input swipe 540 1650 540 450 600
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml window-bottom.xml
            grep -q 'text="开始"\|text="▶ 开始"' window-bottom.xml
            adb shell input tap 270 1680
            sleep 12
            adb shell pidof com.quanyou.metronome
            ! adb logcat -d | grep -E 'FATAL EXCEPTION|Process: com.quanyou.metronome|AndroidRuntime.*Exception'
