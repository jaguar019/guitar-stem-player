name: Metronome Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android_metronome/**'
      - '.github/workflows/metronome-android.yml'
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-android-universal-p4a-2024
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext
          python3 -m pip install --user --upgrade buildozer==1.5.0 Cython==0.29.37
      - name: Verify app starts
        working-directory: android_metronome
        run: |
          python3 -m pip install --user kivy==2.3.1
          timeout 8s xvfb-run -a python3 main.py || test $? -eq 124
      - name: Build APK
        working-directory: android_metronome
        run: |
          set -o pipefail
          ~/.local/bin/buildozer -v android debug 2>&1 | tee android-build.log
      - name: Save failure log
        if: failure()
        working-directory: android_metronome
        run: tail -n 1800 android-build.log > android-build-tail.log
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-failure-log
          path: android_metronome/android-build-tail.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanyouMetronome-Android
          path: android_metronome/bin/*.apk
          if-no-files-found: error
      - name: Test APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android_metronome/bin/*.apk
            adb logcat -c
            adb shell am start -W -n com.quanyou.quanyoumetronome/org.kivy.android.PythonActivity
            sleep 10
            adb shell pidof com.quanyou.quanyoumetronome
            ! adb logcat -d | grep -E "FATAL EXCEPTION|PythonActivity.*has died|Traceback"
