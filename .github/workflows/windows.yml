name: Windows EXE
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop_app/**'
      - '.github/workflows/windows.yml'
  push:
    paths:
      - 'desktop_app/**'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r desktop_app/requirements-build.txt
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Locate FFmpeg
        shell: pwsh
        run: |
          $path = (Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          if (-not $path) { throw 'FFmpeg binary not found' }
          Copy-Item $path desktop_app/ffmpeg.exe
      - name: Build desktop app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name GuitarStemPlayer --paths . --collect-all demucs --collect-all torch --collect-all torchaudio --collect-all scipy --collect-all sounddevice --collect-all soundfile --add-binary "desktop_app/ffmpeg.exe;." desktop_app/app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GuitarStemPlayer-Windows
          path: dist/GuitarStemPlayer.exe
