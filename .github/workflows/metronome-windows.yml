name: Metronome Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'metronome_app/**'
      - '.github/workflows/metronome-windows.yml'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build tools
        run: python -m pip install -r metronome_app/requirements-build.txt
      - name: Test sound generation
        run: python metronome_app/app.py --self-test
      - name: Build metronome
        run: pyinstaller --noconfirm --clean --onefile --windowed --name QuanyouMetronome metronome_app/app.py
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/QuanyouMetronome.exe' -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Metronome EXE failed smoke test' }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: QuanyouMetronome-Windows
          path: dist/QuanyouMetronome.exe
